name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'

      - name: Check production JavaScript and quality policy
        run: |
          node --check app.js
          node --check motion.js
          node --check preloader-boot.js
          node --test tests/preloader-boot.test.mjs
          node --check assets/liquid-navbar.js
          node --check assets/portfolio-v2.js
          node scripts/quality-gate.mjs

      - name: Validate production HTML references
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse, unquote

          root = Path('.').resolve()
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.refs = []
              def handle_starttag(self, _, attrs):
                  data = dict(attrs)
                  for key in ('src', 'href'):
                      if data.get(key): self.refs.append(data[key])

          parser = Parser()
          parser.feed((root / 'index.html').read_text(encoding='utf-8'))
          missing = []
          for ref in parser.refs:
              if ref.startswith(('#', 'mailto:', 'tel:')): continue
              parsed = urlparse(ref)
              if parsed.scheme or parsed.netloc: continue
              path = unquote(parsed.path)
              if not path or path == '/': continue
              local = root / path.lstrip('/')
              if not local.exists(): missing.append(ref)
          if missing:
              raise SystemExit('Missing local references:\n' + '\n'.join(sorted(set(missing))))
          print(f'Validated {len(parser.refs)} HTML references.')

      - name: Install pinned source toolchain
        run: npm install --global pnpm@11.25.0 --ignore-scripts

      - name: Reproduce React production bundles
        working-directory: source/portfolio-copper
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run check
          pnpm run build
          cmp dist/assets/liquid-navbar.js ../../assets/liquid-navbar.js
          cmp dist/assets/liquid-navbar.css ../../assets/liquid-navbar.css
          cmp dist/assets/portfolio-v2.js ../../assets/portfolio-v2.js
          cmp dist/assets/portfolio-v2.css ../../assets/portfolio-v2.css
